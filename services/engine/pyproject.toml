[project]
name = "mosaic-engine"
version = "0.1.0"
description = "Server-authoritative API boundary for Mosaic scientific and application logic."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=9,<10",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

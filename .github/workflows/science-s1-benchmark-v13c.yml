name: Science S1 Resolution Horizon Benchmark v13c

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v13c resolution horizon benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v13c > s1-benchmark-v13c.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v13c.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print('spacing\tparams\teffective_deg\thorizon\tstop\tfalse_all\texcluded\tmedian_stop')
          for cell in result['grid_cells']:
              for summary in cell['horizon_summaries']:
                  print(
                      f"{cell['grid_spacing_degrees']:.1f}\t{cell['parameter_count']}\t"
                      f"{cell['effective_grid_radius_degrees']:.1f}\t{summary['horizon']}\t"
                      f"{summary['stop_rate']:.6f}\t{summary['false_stop_rate']:.6f}\t"
                      f"{summary['true_excluded_ever_rate']:.6f}\t"
                      f"{summary['stopping_observation']['median']}"
                  )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-resolution-horizon-benchmark-v13c
          path: s1-benchmark-v13c.json
          if-no-files-found: error
          retention-days: 14

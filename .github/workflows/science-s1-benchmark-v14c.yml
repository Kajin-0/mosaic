name: Science S1 Coupled Continuous Bound v14c

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v14c coupled-bound benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v14c > s1-benchmark-v14c.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v14c.json').read_text())
          print(result['benchmark_version'])
          print(result['bound_validation'])
          for scenario in result['closure_scenarios']:
              print(scenario)
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-coupled-continuous-bound-v14c
          path: s1-benchmark-v14c.json
          if-no-files-found: error
          retention-days: 14

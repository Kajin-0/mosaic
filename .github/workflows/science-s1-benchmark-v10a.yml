name: Science S1 Fixed-Signal Directional Law Benchmark v10a

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v10a fixed-signal passive benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v10a > s1-benchmark-v10a.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v10a.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print(f"raw_runs={len(result['raw_runs'])}")
          print('d\tkappa\tq\tpop_order\theldout_order\tboundary_pred\tfisher_pred\tmae_boundary\tmae_fisher\tfalse_dir\tslope_cos\tconv')
          for cell in result['cells']:
              print(
                  f"{cell['feature_dimension']}\t{cell['realized_kappa']:.3f}\t"
                  f"{cell['query_count']}\t"
                  f"{cell['gaussian_population_ordering_error']['mean']:.6f}\t"
                  f"{cell['ranking_metrics']['ordering_error_rate']['mean']:.6f}\t"
                  f"{cell['boundary_ordering_prediction']:.6f}\t"
                  f"{cell['gaussian_logistic_ordering_prediction']:.6f}\t"
                  f"{cell['mean_absolute_boundary_law_residual']:.6f}\t"
                  f"{cell['mean_absolute_gaussian_logistic_law_residual']:.6f}\t"
                  f"{cell['false_direction_rate']:.6f}\t"
                  f"{cell['direction_metrics']['slope_cosine']['mean']:.6f}\t"
                  f"{cell['convergence_rate']:.6f}"
              )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-fixed-signal-sample-complexity-benchmark-v10a
          path: s1-benchmark-v10a.json
          if-no-files-found: error
          retention-days: 14

name: Science S1 v14 Canonical Format Fix

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: apply canonical S1 v14 formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Apply canonical Ruff fixes
        run: |
          uv run --project services/engine ruff check --fix services/engine/src/mosaic_engine/science_s1_continuous_geometry.py services/engine/tests/test_science_s1_continuous_geometry.py
          uv run --project services/engine ruff format services/engine/src/mosaic_engine/science_s1_continuous_geometry.py services/engine/tests/test_science_s1_continuous_geometry.py

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'Kajin-0'
          git config user.email '28634576+Kajin-0@users.noreply.github.com'
          git add services/engine/src/mosaic_engine/science_s1_continuous_geometry.py services/engine/tests/test_science_s1_continuous_geometry.py
          git commit -m 'style: apply canonical S1 v14 formatting'
          git push origin HEAD:science/s1-identifiable-preference-model

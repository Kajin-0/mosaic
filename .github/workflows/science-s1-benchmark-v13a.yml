name: Science S1 Finite-Null E-Process Benchmark v13a

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v13a finite-null e-process benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v13a > s1-benchmark-v13a.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v13a.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          for key in ('valid_null_aggregate', 'leaky_null_aggregate', 'alternative_power'):
              summary = result[key]
              print(
                  key,
                  f"runs={summary['runs']}",
                  f"rejections={summary['rejections']}",
                  f"rate={summary['rejection_rate']:.6f}",
                  f"median_stop={summary['stopping_observation']['median']}",
              )
          print('null_angle\tvalid_rate\tleaky_rate')
          for cell in result['null_cells']:
              print(
                  f"{cell['true_null_angle_degrees']}\t"
                  f"{cell['valid']['rejection_rate']:.6f}\t"
                  f"{cell['leaky']['rejection_rate']:.6f}"
              )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-finite-null-eprocess-benchmark-v13a
          path: s1-benchmark-v13a.json
          if-no-files-found: error
          retention-days: 14

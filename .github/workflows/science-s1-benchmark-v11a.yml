name: Science S1 Signal Scaling Benchmark v11a

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v11a iso-information signal-scaling benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v11a > s1-benchmark-v11a.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v11a.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print(f"raw_runs={len(result['raw_runs'])}")
          print('d\tB\teta_target\teta_real\tq\tpop_order\tlarge_pred\tfinite_pred\tfalse_dir\tconv')
          for cell in result['cells']:
              print(
                  f"{cell['feature_dimension']}\t{cell['slope_norm']:.3f}\t"
                  f"{cell['eta_target']:.3f}\t{cell['realized_eta']:.6f}\t"
                  f"{cell['query_count']}\t"
                  f"{cell['gaussian_population_ordering_error']['mean']:.6f}\t"
                  f"{cell['large_dimension_prediction']:.6f}\t"
                  f"{cell['finite_dimension_prediction']:.6f}\t"
                  f"{cell['false_direction_rate']:.6f}\t"
                  f"{cell['convergence_rate']:.6f}"
              )
          print('collapse: d\teta_target\tobs_range\tobs_sd\tlarge_resid_range\tfinite_resid_range')
          for group in result['collapse_groups']:
              print(
                  f"{group['feature_dimension']}\t{group['eta_target']:.3f}\t"
                  f"{group['observed_mean_error_range']:.6f}\t"
                  f"{group['observed_mean_error_pstdev']:.6f}\t"
                  f"{group['large_residual_mean_range']:.6f}\t"
                  f"{group['finite_residual_mean_range']:.6f}"
              )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-signal-scaling-benchmark-v11a
          path: s1-benchmark-v11a.json
          if-no-files-found: error
          retention-days: 14

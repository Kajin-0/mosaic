name: Phase 8 Contract Bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Phase 8 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install frozen dependencies
        run: |
          uv sync --project services/engine --all-groups --frozen
          npm ci --no-audit --no-fund

      - name: Generate and validate contracts
        run: |
          npm run contracts:sync
          npm run contracts:check

      - name: Reject unrelated generated changes
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -v -E '^(packages/contracts/openapi\.json|packages/contracts/src/generated\.ts)$' || true)"
          if test -n "$unexpected"; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit Phase 8 generated contracts once
        shell: bash
        run: |
          if git diff --quiet -- packages/contracts/openapi.json packages/contracts/src/generated.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/openapi.json packages/contracts/src/generated.ts
          git commit -m 'chore: regenerate Phase 8 API contracts'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

name: Phase 4 Vertical Slice

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'services/engine/**'
      - 'packages/contracts/**'
      - 'supabase/**'
      - 'scripts/test-api-contract.mjs'
      - 'scripts/test-phase4-vertical-slice.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase4-vertical-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Install locked JavaScript workspace graph
        run: npm ci --no-audit --no-fund

      - name: Verify pinned Supabase CLI
        run: test "$(npx supabase --version)" = "2.114.0"

      - name: Start local Supabase
        run: npx supabase start

      - name: Rebuild database from migrations and seed
        run: npx supabase db reset

      - name: Export local runtime configuration
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "MOSAIC_ENGINE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "MOSAIC_ENGINE_SUPABASE_PUBLIC_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "MOSAIC_ENGINE_SUPABASE_SERVER_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_MOSAIC_ENGINE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "MOSAIC_TEST_ENGINE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"

      - name: Validate engine
        run: npm run engine:check

      - name: Regenerate and validate contracts
        run: |
          npm run contracts:sync
          npm run contracts:check

      - name: Validate mobile client
        run: npm run mobile:check

      - name: Bundle all Expo platforms
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir dist-p4-ci

      - name: Start Mosaic engine
        shell: bash
        run: |
          uv run --project services/engine uvicorn mosaic_engine.main:app --host 127.0.0.1 --port 8000 > /tmp/mosaic-engine.log 2>&1 &
          echo $! > /tmp/mosaic-engine.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mosaic-engine.log
          exit 1

      - name: Run authenticated ten-trial integration test
        run: node scripts/test-phase4-vertical-slice.mjs

      - name: Reject dependency or generated-contract drift
        run: |
          git diff --exit-code -- \
            services/engine/uv.lock \
            package-lock.json \
            packages/contracts/openapi.json \
            packages/contracts/src/generated.ts

      - name: Show engine log on failure
        if: failure()
        run: cat /tmp/mosaic-engine.log 2>/dev/null || true

      - name: Stop Mosaic engine
        if: always()
        run: kill "$(cat /tmp/mosaic-engine.pid)" 2>/dev/null || true

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true

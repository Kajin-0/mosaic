name: Science S1 Local Neighbor Benchmark v13i

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v13i local-neighbor benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v13i > s1-benchmark-v13i.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v13i.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print('predictor\thorizon\tstop\tfalse\tgeometry\texcluded\tempty\tmedian')
          for summary in result['summaries']:
              print(
                  f"{summary['predictor']}\t{summary['horizon']}\t"
                  f"{summary['stop_rate']:.6f}\t{summary['false_stop_rate']:.6f}\t"
                  f"{summary['geometry_violations']}\t"
                  f"{summary['truth_excluded_ever_rate']:.6f}\t"
                  f"{summary['nested_empty_rate']:.6f}\t"
                  f"{summary['stopping_observation']['median']}"
              )
          print('paired_comparisons')
          for comparison in result['paired_comparisons']:
              print(comparison)
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-local-neighbor-benchmark-v13i
          path: s1-benchmark-v13i.json
          if-no-files-found: error
          retention-days: 14

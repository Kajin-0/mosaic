name: Phase 3 Engine and Contracts

on:
  pull_request:
    paths:
      - 'services/engine/**'
      - 'packages/contracts/**'
      - 'scripts/test-api-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase3-engine-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-engine-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Install locked JavaScript workspace graph
        run: npm ci --no-audit --no-fund

      - name: Validate engine
        run: npm run engine:check

      - name: Regenerate OpenAPI and TypeScript contracts
        run: npm run contracts:sync

      - name: Validate TypeScript contract package
        run: npm run contracts:check

      - name: Reject generated contract drift
        run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated.ts

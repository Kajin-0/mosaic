name: Phase 3 Engine and Contracts

on:
  pull_request:
    paths:
      - 'services/engine/**'
      - 'packages/contracts/**'
      - 'scripts/test-api-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase3-engine-contracts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-engine-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Resolve Python environment
        run: uv sync --project services/engine --all-groups

      - name: Resolve JavaScript workspace graph
        run: npm install --no-audit --no-fund

      - name: Validate engine
        run: npm run engine:check

      - name: Generate OpenAPI and TypeScript contracts
        run: npm run contracts:sync

      - name: Validate TypeScript contract package
        run: npm run contracts:check

      - name: Commit initial generated contracts and lockfiles
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- services/engine/uv.lock package-lock.json packages/contracts/openapi.json packages/contracts/src/generated.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/engine/uv.lock package-lock.json packages/contracts/openapi.json packages/contracts/src/generated.ts
          git commit -m 'chore: lock Phase 3 contracts and dependencies'
          git push origin HEAD:${{ github.head_ref }}

name: Science S1 Finite Confidence Geometry Benchmark v13b

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v13b finite confidence geometry benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v13b > s1-benchmark-v13b.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v13b.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print('target\tstop_rate\tfalse_all\tfalse_given_stop\texcluded_ever\tmedian_stop')
          for summary in result['aggregate_target_summaries']:
              print(
                  f"{summary['target_error']:.3f}\t"
                  f"{summary['stop_rate']:.6f}\t"
                  f"{summary['false_stop_rate']:.6f}\t"
                  f"{summary['false_stop_given_stop']:.6f}\t"
                  f"{summary['true_excluded_ever_rate']:.6f}\t"
                  f"{summary['stopping_observation']['median']}"
              )

          print('worst angle cells: target\tangle\tstop_rate\tfalse_all\tfalse_given_stop\texcluded_ever')
          for target in result['config']['target_errors']:
              cells = []
              for cell in result['angle_cells']:
                  summary = next(
                      item for item in cell['target_summaries']
                      if item['target_error'] == target
                  )
                  cells.append((summary['false_stop_given_stop'], cell['true_angle_degrees'], summary))
              for _, angle, summary in sorted(cells, reverse=True)[:3]:
                  print(
                      f"{target:.3f}\t{angle}\t{summary['stop_rate']:.6f}\t"
                      f"{summary['false_stop_rate']:.6f}\t"
                      f"{summary['false_stop_given_stop']:.6f}\t"
                      f"{summary['true_excluded_ever_rate']:.6f}"
                  )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-finite-confidence-geometry-benchmark-v13b
          path: s1-benchmark-v13b.json
          if-no-files-found: error
          retention-days: 14

name: Science S1 Unresolved Box Attribution v14d

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v14d attribution benchmark
        run: uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v14d > s1-benchmark-v14d.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v14d.json').read_text())
          print(result['benchmark_version'])
          for scenario in result['scenarios']:
              print(scenario['scenario'])
              for side in scenario['sides']:
                  print('side', side['side'])
                  for method in ('grouped', 'coupled'):
                      payload = side[method]
                      print(method, payload['nodes_visited'], payload['terminal_reason'], payload['counts'], 'final=', payload['final_unresolved_boxes'], 'probe_joint=', payload['final_box_probe_joint_survivors'])
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-unresolved-box-attribution-v14d
          path: s1-benchmark-v14d.json
          if-no-files-found: error
          retention-days: 14

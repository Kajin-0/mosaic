name: Science S1 v14 Format Artifact

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Apply canonical Ruff formatting
        run: |
          uv run --project services/engine ruff check --fix services/engine/src/mosaic_engine/science_s1_continuous_geometry.py services/engine/tests/test_science_s1_continuous_geometry.py || true
          uv run --project services/engine ruff format services/engine/src/mosaic_engine/science_s1_continuous_geometry.py services/engine/tests/test_science_s1_continuous_geometry.py

      - name: Upload canonical files
        uses: actions/upload-artifact@v4
        with:
          name: s1-v14-canonical-format
          path: |
            services/engine/src/mosaic_engine/science_s1_continuous_geometry.py
            services/engine/tests/test_science_s1_continuous_geometry.py
          if-no-files-found: error
          retention-days: 2

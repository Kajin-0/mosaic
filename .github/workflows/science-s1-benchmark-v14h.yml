name: Science S1 Exact Common Polytope v14h

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v14h exact common polytope benchmark
        run: uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v14h > s1-benchmark-v14h.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v14h.json').read_text())
          print(result['benchmark_version'])
          for scenario in result['scenarios']:
              print(scenario['scenario'])
              print('halfspaces', scenario['halfspace_count'], 'vertices', scenario['feasible_vertex_count'])
              print('box', {
                  'axis_width_ratios': scenario['box']['axis_width_ratios'],
                  'volume_ratio': scenario['box']['volume_ratio'],
              })
              print('direct_grid_validation', scenario['direct_grid_validation'])
              if 'known_240_survivor' in scenario:
                  print('known_240_survivor', scenario['known_240_survivor'])
          for case in result['directional_replay']:
              candidate = case['tightened_common_box']
              print(case['case'])
              print('reference', case['reference_v14g'])
              print('candidate', {
                  'certified': candidate['certified'],
                  'evaluations': candidate['evaluations'],
                  'unresolved_boxes': candidate['unresolved_boxes'],
                  'active_unresolved_boxes': candidate.get('active_unresolved_boxes'),
                  'resolution_frozen_boxes': candidate.get('resolution_frozen_boxes'),
                  'terminal_reason': candidate['terminal_reason'],
                  'counts': candidate['counts'],
                  'selected_dimensions': candidate['selected_dimensions'],
                  'elapsed_seconds': candidate['elapsed_seconds'],
              })
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-exact-common-polytope-v14h
          path: s1-benchmark-v14h.json
          if-no-files-found: error
          retention-days: 14

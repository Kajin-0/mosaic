name: Science S1 Gaussian Controlled Geometry Benchmark v9a

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Run exploratory S1 v9a Gaussian controlled-geometry benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v9a > s1-benchmark-v9a.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v9a.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print(f"raw_runs={len(result['raw_runs'])}")
          print('d\tkappa\tq\tpolicy\tpair_regret\torder_error\ttopk_regret\tprob_mse\tslope_cos\tslope_snr\tconv')
          for cell in result['cells']:
              metrics = cell['metrics']
              ranking = cell['ranking_metrics']
              direction = cell['direction_metrics']
              print(
                  f"{cell['feature_dimension']}\t{cell['realized_kappa']:.3f}\t"
                  f"{cell['query_count']}\t{cell['policy']}\t"
                  f"{ranking['probability_regret']['mean']:.6f}\t"
                  f"{ranking['ordering_error_rate']['mean']:.6f}\t"
                  f"{metrics['top_k_regret']['mean']:.6f}\t"
                  f"{metrics['probability_mse']['mean']:.6f}\t"
                  f"{direction['slope_cosine']['mean']:.6f}\t"
                  f"{direction['slope_signal_to_uncertainty']['mean']:.6f}\t"
                  f"{cell['convergence_rate']:.6f}"
              )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-gaussian-controlled-geometry-benchmark-v9a
          path: s1-benchmark-v9a.json
          if-no-files-found: error
          retention-days: 14

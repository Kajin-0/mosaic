name: Science S1 Nested Confidence Benchmark v13f

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v13f nested-confidence benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v13f > s1-benchmark-v13f.json

      - name: Print concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v13f.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print('predictor\trepresentation\tstop\tfalse\tgeometry\tmedian')
          for summary in result['summaries']:
              print(
                  f"{summary['predictor']}\t{summary['representation']}\t"
                  f"{summary['stop_rate']:.6f}\t{summary['false_stop_rate']:.6f}\t"
                  f"{summary['geometry_violations']}\t"
                  f"{summary['stopping_observation']['median']}"
              )
          print('paired_gains')
          for gain in result['paired_gains']:
              print(gain)
          print('nested_empty_rates', result['nested_empty_rates'])
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-nested-confidence-benchmark-v13f
          path: s1-benchmark-v13f.json
          if-no-files-found: error
          retention-days: 14

name: Science S1 Transverse Stopping Benchmark v12d

on:
  push:
    branches:
      - science/s1-identifiable-preference-model

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact science head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.4

      - name: Install locked Python environment
        run: uv sync --project services/engine --all-groups --frozen

      - name: Validate engine before benchmark
        run: |
          uv run --project services/engine ruff check services/engine/src services/engine/tests
          uv run --project services/engine ruff format --check services/engine/src services/engine/tests
          uv run --project services/engine mypy services/engine/src
          uv run --project services/engine pytest services/engine/tests -q

      - name: Run S1 v12d fresh-seed transverse stopping benchmark
        run: |
          uv run --project services/engine python -m mosaic_engine.science_s1_benchmark_v12d > s1-benchmark-v12d.json

      - name: Print prospective benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('s1-benchmark-v12d.json').read_text())
          print(result['benchmark_version'])
          print(result['scientific_scope'])
          print(f"paths={len(result['paths'])}")
          print(f"primary_gate={result['primary_gate']}")
          print('target\trule\tstop\tfalse_given_stop\twilson_hi\tmiss_cap\tq_med')
          for summary in result['aggregate_rule_summaries']:
              interval = summary['false_stop_given_stop_wilson95']
              q_med = summary['stopping_query_count']['median']
              print(
                  f"{summary['target_error']:.3f}\t{summary['rule']}\t"
                  f"{summary['stop_rate']:.6f}\t{summary['false_stop_given_stop']:.6f}\t"
                  f"{interval['upper']:.6f}\t{summary['missed_stop_at_cap_rate']:.6f}\t"
                  f"{q_med if q_med is not None else 'NA'}"
              )
          print('primary cells: d\tB\ttarget\tstops\tfalse_given_stop\tstop_rate')
          for cell in result['cells']:
              for summary in cell['rule_summaries']:
                  if summary['rule'] != result['config']['primary_rule']:
                      continue
                  print(
                      f"{cell['feature_dimension']}\t{cell['slope_norm']:.3f}\t"
                      f"{summary['target_error']:.3f}\t{summary['stops']}\t"
                      f"{summary['false_stop_given_stop']:.6f}\t"
                      f"{summary['stop_rate']:.6f}"
                  )
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: s1-transverse-stopping-benchmark-v12d
          path: s1-benchmark-v12d.json
          if-no-files-found: error
          retention-days: 14
